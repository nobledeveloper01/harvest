name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned: an unpinned `stable` is a different Flutter every month, and the
  # Android toolchain it carries decides whether the plugins compile.
  FLUTTER_VERSION: 3.47.1

jobs:
  gates:
    name: Gates and the domain coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # doc-check asks git what is tracked and when
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.47.1' }
      - run: python3 -m pip install --quiet Pillow
      - run: make setup
      - run: make gates

  analyze:
    name: Analyze and the domain purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.47.1' }
      - run: make setup
      - run: make analyze

  test:
    name: App tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.47.1' }
      - run: make setup
      - run: make test

  server:
    name: Server typecheck and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: harvest
          POSTGRES_PASSWORD: harvest
          POSTGRES_DB: harvest_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U harvest"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.5.2 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm, cache-dependency-path: server/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: server
      - run: make server-check
        env:
          TEST_DATABASE_URL: postgres://harvest:harvest@localhost:5432/harvest_test

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.47.1' }
      - run: flutter config --no-enable-swift-package-manager
      - run: make setup
      - run: flutter build ios --simulator --debug
        working-directory: app

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.47.1' }
      - run: make setup
      - run: flutter build apk --debug --split-per-abi
        working-directory: app
